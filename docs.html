<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Documentation - Dillo Resources</title>

    <link
        rel="stylesheet"
        href="resources.css"
    >

    <!-- Markdown -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>

    <!-- Syntax highlighting -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            <a href="index.html">
                dillo resources
            </a>
        </h1>

        <nav>

            <a href="index.html">
                Library
            </a>

            <a href="https://dillo-rodev.github.io/my-page/">
                Portfolio
            </a>

        </nav>

    </header>


    <!-- =========================
         DOCUMENTATION
    ========================== -->

    <main class="documentation-layout">


        <!-- =========================
             LEFT SIDEBAR
        ========================== -->

        <aside class="documentation-sidebar">

            <div class="sidebar-title">
                CONTENTS
            </div>

            <nav
                id="documentation-navigation"
                class="documentation-navigation"
            >
            </nav>

        </aside>


        <!-- =========================
             MAIN DOCUMENT
        ========================== -->

        <article
            id="documentation-content"
            class="documentation-content"
        >

            <div class="documentation-loading">
                Loading documentation...
            </div>

        </article>


        <!-- =========================
             RIGHT INFORMATION
        ========================== -->

        <aside
            id="resource-information"
            class="resource-information"
        >

            <div class="information-loading">
                Loading...
            </div>

        </aside>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="resources.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js">
    </script>

        src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-lua.min.js">
    </script>

</html>
